name: AgentPad13 desktop checks

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/agentpad-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/agentpad-desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config libudev-dev libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev librsvg2-dev
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        run: pnpm test --run
      - name: Build frontend
        run: pnpm build
      - name: Run Rust tests
        working-directory: apps/agentpad-desktop/src-tauri
        run: cargo test
      - name: Build debug desktop bundle
        if: runner.os != 'Windows'
        run: pnpm tauri build --debug
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis
      - name: Build Windows portable with fixed WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows-portable.ps1
      - name: Validate extracted Windows portable
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $zip = Get-ChildItem output/windows/*_portable.zip
          ./scripts/test-windows-portable.ps1 -Archive $zip.FullName
      - name: Attach Windows installer and portable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: AgentPad13-Windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/agentpad-desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/agentpad-desktop/output/windows/*.zip
            apps/agentpad-desktop/output/windows/*.sha256
