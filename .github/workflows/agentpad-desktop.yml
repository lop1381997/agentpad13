name: AgentPad13 desktop checks

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/agentpad-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/agentpad-desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config libudev-dev libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev librsvg2-dev
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        run: pnpm test --run
      - name: Build frontend
        run: pnpm build
      - name: Run Rust tests
        working-directory: apps/agentpad-desktop/src-tauri
        run: cargo test
      - name: Build debug desktop bundle
        run: pnpm tauri build --debug
